services:
  it-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-tracker-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DB_PATH=/app/backend/data/database.db
      - OPENCVE_URL=${OPENCVE_URL:-http://host.docker.internal:8000}
      - OPENCVE_USER=${OPENCVE_USER:-admin}
      - OPENCVE_PASSWORD=${OPENCVE_PASSWORD:-admin}
      - OPENCVE_HOST_HEADER=${OPENCVE_HOST_HEADER:-}
      - TRACKER_ADMIN_USER=${TRACKER_ADMIN_USER:-admin}
      - TRACKER_ADMIN_PASSWORD=${TRACKER_ADMIN_PASSWORD}
      - ENABLE_UPTIME_KUMA=${ENABLE_UPTIME_KUMA:-true}
    volumes:
      # Persistance de la base de données SQLite locale sur la machine hôte
      # Les données seront stockées dans un dossier local "./data" à la racine du projet
      - ./data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
