server {
    listen 80;
    server_name _ localhost;

    # Application d'inventaire actuelle
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subrequest d'authentification Nginx pour IT-TRACKER
    location = /api/verify-auth {
        proxy_pass http://127.0.0.1:5000/api/verify-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # OpenCVE
    location /opencve {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header SCRIPT_NAME /opencve;
        proxy_set_header X-Forwarded-Prefix /opencve;
    }

    # Vigil365 (Protégé par l'authentification IT-TRACKER)
    location /vigil/ {
        auth_request /api/verify-auth;
        error_page 401 = @vigil_unauthorized;

        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @vigil_unauthorized {
        return 302 $scheme://$http_host/?redirect=/vigil/;
    }

    location = /vigil {
        return 301 /vigil/;
    }
}

server {
    listen 3001;
    server_name _ localhost;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

